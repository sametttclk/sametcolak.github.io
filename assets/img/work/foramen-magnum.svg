<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg_fm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#020c1b"/>
    </linearGradient>
    <linearGradient id="cyan_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg_fm)"/>
  <!-- Cranial / ellipse diagram -->
  <ellipse cx="320" cy="180" rx="140" ry="110" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  <ellipse cx="320" cy="190" rx="50" ry="65" fill="#0d2538" stroke="url(#cyan_grad)" stroke-width="2.5"/>
  <!-- Measurement vectors -->
  <line x1="320" y1="125" x2="320" y2="255" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="270" y1="190" x2="370" y2="190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- Feature data points (PCA scatter) -->
  <circle cx="210" cy="130" r="4.5" fill="#38bdf8"/>
  <circle cx="230" cy="145" r="4.5" fill="#38bdf8"/>
  <circle cx="195" cy="160" r="4.5" fill="#38bdf8"/>
  <circle cx="220" cy="175" r="4.5" fill="#38bdf8"/>
  <circle cx="410" cy="210" r="4.5" fill="#f43f5e"/>
  <circle cx="430" cy="195" r="4.5" fill="#f43f5e"/>
  <circle cx="445" cy="225" r="4.5" fill="#f43f5e"/>
  <circle cx="420" cy="240" r="4.5" fill="#f43f5e"/>
  <!-- Decision Boundary line -->
  <line x1="260" y1="280" x2="380" y2="90" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="390" y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fbbf24">SVM Hyperplane</text>
  <!-- Labels -->
  <text x="320" y="45" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#e2e8f0" text-anchor="middle" letter-spacing="3">FORAMEN MAGNUM GENDER CLASSIFIER</text>
  <text x="320" y="365" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="1.5">MACHINE LEARNING | PCA &amp; LDA | KNN / SVM</text>
</svg>
